apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: treetracker-admin-api-keycloak-prod-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Greenstand/treetracker-admin-api
    targetRevision: keycloak
    path: deployment/overlays/keycloak-production
  destination:
    server: https://kubernetes.default.svc
    namespace: admin-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
