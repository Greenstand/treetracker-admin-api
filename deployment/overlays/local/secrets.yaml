# Local plain Secrets replacing the base sealed-secrets. admin-api reads public.trees from the
# treetracker DB; ENABLE_VERIFY_PUBLISHING=false so the rabbitmq URL is unused for /verify.
apiVersion: v1
kind: Secret
metadata:
  name: database-connection
  namespace: admin-api
stringData:
  db: "postgresql://postgres:postgres@postgres.data.svc.cluster.local:5432/treetracker?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: treetracker-api-jwt
  namespace: admin-api
stringData:
  jwt: "local-dev-admin-jwt-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: treetracker-rabbitmq-connection
  namespace: admin-api
stringData:
  messageQueue: "amqp://guest:guest@rabbitmq.rabbitmq.svc.cluster.local:5672"
