# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Admin Panel API CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  project-directory: ./

jobs:
  test:
    name: Test API Project
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, 'skip-ci')
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Use Node.js 12.x
        uses: actions/setup-node@v1
        with:
          node-version: '12.x'
      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}
      - name: run ESLint
        run: npm run lint
        working-directory: ${{ env.project-directory }}
      - name: build api project
        run: npm run build
        working-directory: ${{ env.project-directory }}
      - name: run api tests
        run: npm run test:ci
        working-directory: ${{ env.project-directory }}

  release:
    name: Release semantic version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository == 'Greenstand/treetracker-admin-api'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - run: npm i -g semantic-release @semantic-release/{git,exec,changelog}

      - name: Run semantic-release
        id: semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build snapshot and push on merge
        id: docker_build_release
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: greenstand/treetracker-admin-api:${{ steps.semantic-release.outputs.new-release-version }}

      - name: Install kustomize
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Run kustomize
        if: steps.semantic-release.outputs.new-release-published == 'true'
        env:
          IMAGE_NAME: greenstand/treetracker-admin-api
          IMAGE_TAG: ${{ steps.semantic-release.outputs.new-release-version }}
        run: |
          cd deployment/overlays/development
          ../../../kustomize edit set image "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Commit dev kustomization file with new app version
        id: commit-image-tag
        if: steps.semantic-release.outputs.new-release-published == 'true'
        env:
          IMAGE_TAG: ${{ steps.semantic-release.outputs.new-release-version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add deployment/overlays/development
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump docker image tag ${IMAGE_TAG} [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit-image-tag.outputs.committed == 'true'
        run: git push origin HEAD:master
